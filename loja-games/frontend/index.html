<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Point Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <a class="logo" href="#" data-modo="loja"><span>SAVE</span>POINT</a>
    <nav class="modos">
      <button class="modo ativo" data-modo="loja">Loja</button>
      <button class="modo" data-modo="admin">Administração</button>
    </nav>
    <button class="btn-carrinho" id="abrir-carrinho">
      Carrinho <span id="qtd-carrinho">0</span>
    </button>
  </header>

  <!-- ===================== LOJA ===================== -->
  <main id="loja" class="area ativa">
    <section class="destaque" id="destaque"></section>

    <section class="filtros">
      <div class="chips" id="chips-plataforma"></div>
      <div class="filtros-linha">
        <select id="filtro-categoria"><option value="">Todas as categorias</option></select>
        <input id="filtro-busca" type="search" placeholder="Buscar jogo ou desenvolvedora...">
      </div>
    </section>

    <p class="contagem" id="contagem"></p>
    <section class="vitrine" id="vitrine"></section>
  </main>

  <!-- ===================== ADMIN ===================== -->
  <main id="admin" class="area">
    <nav class="abas">
      <button class="aba ativa" data-aba="painel">Painel</button>
      <button class="aba" data-aba="jogos">Jogos</button>
      <button class="aba" data-aba="clientes">Clientes</button>
      <button class="aba" data-aba="pedidos">Pedidos</button>
    </nav>

    <section id="painel" class="secao ativa">
      <div class="cards" id="cards-resumo"></div>
      <h3>Mais vendidos</h3>
      <div id="mais-vendidos" class="ranking"></div>
    </section>

    <section id="jogos" class="secao">
      <form id="form-jogo" class="formulario">
        <h3>Cadastrar jogo</h3>
        <div class="grade-form">
          <label class="largo">Título<input name="titulo" required></label>
          <label>Preço (R$)<input name="preco" type="number" step="0.01" min="0" required></label>
          <label>Desconto (%)<input name="desconto" type="number" min="0" max="90" value="0"></label>
          <label>Lançamento<input name="data_lancamento" type="date" required></label>
          <label>Classificação
            <select name="classificacao">
              <option value="0">Livre</option><option>10</option><option>12</option>
              <option>14</option><option>16</option><option>18</option>
            </select>
          </label>
          <label>Estoque<input name="estoque" type="number" min="0" value="0"></label>
          <label>Categoria<select name="categoria_id" id="sel-categoria" required></select></label>
          <label>Desenvolvedora<select name="desenvolvedora_id" id="sel-dev" required></select></label>
          <label class="largo">Descrição<input name="descricao"></label>
          <fieldset class="largo"><legend>Plataformas</legend><div id="check-plataformas"></div></fieldset>
        </div>
        <button type="submit">Cadastrar jogo</button>
      </form>
      <div class="tabela-wrap">
        <table>
          <thead><tr><th>Jogo</th><th>Classif.</th><th>Preço</th><th>Desc. %</th><th>Estoque</th><th></th></tr></thead>
          <tbody id="tabela-jogos"></tbody>
        </table>
      </div>
    </section>

    <section id="clientes" class="secao">
      <form id="form-cliente" class="formulario">
        <h3>Cadastrar cliente</h3>
        <div class="grade-form">
          <label class="largo">Nome<input name="nome" required></label>
          <label>E-mail<input name="email" type="email" required></label>
          <label>CPF<input name="cpf" maxlength="14" placeholder="só números" required></label>
          <label>Nascimento<input name="data_nascimento" type="date" required></label>
        </div>
        <button type="submit">Cadastrar cliente</button>
      </form>
      <div class="tabela-wrap">
        <table>
          <thead><tr><th>Nome</th><th>E-mail</th><th>Documento</th><th>Idade</th><th>Pedidos</th><th></th></tr></thead>
          <tbody id="tabela-clientes"></tbody>
        </table>
      </div>
    </section>

    <section id="pedidos" class="secao">
      <div class="tabela-wrap">
        <table>
          <thead><tr><th>#</th><th>Data</th><th>Cliente</th><th>Itens</th><th>Total</th><th>Status</th></tr></thead>
          <tbody id="tabela-pedidos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ===================== CARRINHO ===================== -->
  <div class="fundo-escuro" id="fundo"></div>
  <aside class="carrinho" id="carrinho">
    <div class="carrinho-topo">
      <h2>Seu carrinho</h2>
      <button class="fechar" id="fechar-carrinho" aria-label="Fechar">✕</button>
    </div>
    <div id="itens-carrinho" class="itens-carrinho"></div>
    <div class="carrinho-rodape">
      <label>Cliente<select id="sel-cliente"></select></label>
      <div class="total-linha"><span>Total</span><strong id="total-carrinho">R$ 0,00</strong></div>
      <button id="finalizar" class="btn-principal">Finalizar pedido</button>
    </div>
  </aside>

  <div id="aviso" class="aviso"></div>

  <div id="aviso-demo" class="aviso-demo" hidden>
    Versão de demonstração: os dados ficam salvos só neste navegador.
    <button id="restaurar-demo">Restaurar dados</button>
  </div>

  <script src="js/offline.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
